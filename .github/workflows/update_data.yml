name: PC28 自动数据更新

on:
  workflow_dispatch:
  schedule:
    # 每小时运行一次，避开整点高峰
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: pc28-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 更新开奖历史
        run: |
          python src/fetch_data.py

      - name: 保存更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical.csv reports/data_update.json
          if git diff --cached --quiet; then
            echo "数据没有变化，无需提交"
          else
            git commit -m "自动更新 PC28 开奖历史"
            git push
          fi
