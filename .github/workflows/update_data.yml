name: PC28 自动数据更新

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pc28-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查更新前的数据
        run: |
          python -c "import csv,os; p='data/historical.csv'; assert os.path.exists(p), '找不到历史CSV'; f=open(p,encoding='utf-8-sig',newline=''); r=list(csv.DictReader(f)); f.close(); nums=[int(x['draw_nbr']) for x in r if x.get('draw_nbr','').isdigit()]; print('更新前记录数:',len(r)); print('更新前最大期号:',max(nums) if nums else '无有效期号'); assert nums, '历史CSV没有有效期号'"

      - name: 更新开奖历史
        run: python -u src/fetch_data.py

      - name: 验证更新后的数据
        run: |
          python -c "import csv,os,sys; p='data/historical.csv'; assert os.path.exists(p), '更新后CSV不存在'; f=open(p,encoding='utf-8-sig',newline=''); r=list(csv.DictReader(f)); f.close(); assert r and 'draw_nbr' in r[0], 'CSV为空或缺少draw_nbr字段'; nums=[int(x['draw_nbr']) for x in r if x.get('draw_nbr','').isdigit()]; assert nums, '没有有效期号'; print('更新后记录数:',len(r)); print('更新后最大期号:',max(nums)); print('重复期号数量:',len(nums)-len(set(nums))); print('最后一行期号:',r[-1].get('draw_nbr','')); gaps=[(a,b) for a,b in zip(sorted(set(nums)),sorted(set(nums))[1:]) if b>a+1]; print('缺期区间数量:',len(gaps)); [print('缺期区间:',a+1,b-1) for a,b in gaps[:30]]; sys.exit(1) if len(nums)!=len(set(nums)) else None"

      - name: 保存更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/historical.csv

          if [ -f reports/data_update.json ]; then
            git add reports/data_update.json
          fi

          if git diff --cached --quiet; then
            echo "本次数据没有变化，无需提交"
          else
            git commit -m "自动更新 PC28 开奖历史"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
