name: PC28 Data Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/raw/initial_history.csv"
      - "data_center/**"
      - ".github/workflows/data-sync.yml"

permissions:
  contents: write

concurrency:
  group: pc28-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install data pipeline dependency
        run: python -m pip install --upgrade requests

      - name: Sync API and maintain rolling 10,000
        run: python data_center/sync.py
        env:
          PC28_API_URL: https://pc28.help/api/kj.json?nbr=100

      - name: Commit dataset changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/history.csv data/processed/rolling_10000.csv data/processed/manifest.json
          if git diff --cached --quiet; then
            echo "No dataset changes."
            exit 0
          fi
          git commit -m "chore(data): sync PC28 draw history"
          git push
